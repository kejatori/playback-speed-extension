<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Playback Speed</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <button id="down" class="round" title="Slower">−</button>
    <div class="readout">
      <input id="num" type="number" min="0.1" max="16" step="0.05" aria-label="Speed" />
      <span>×</span>
    </div>
    <button id="up" class="round" title="Faster">+</button>
  </header>

  <input id="slider" type="range" min="0" max="1000" step="1" aria-label="Speed slider" />
  <div class="scale"><span>0.1×</span><span>1×</span><span>4×</span><span>16×</span></div>

  <div id="presets" class="presets"></div>

  <div id="shortcuts" class="shortcuts"></div>
  <p class="note">Applies to every video &amp; audio in this tab (all frames). Max 16× is the browser's limit.</p>

  <script src="popup.js"></script>
</body>
</html>
